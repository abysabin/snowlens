<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — SnowLens Full Edition | VizCanvaz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0A1628; --ice: #29ABE2; --ice-glow: rgba(41,171,226,0.15);
    --amber: #F5A623; --amber-dim: #C8861A; --white: #F8FAFF; --surface: #0D1B35;
    --border: rgba(41,171,226,0.18); --text: #D6E8F5; --text-dim: #7EA8C4;
    --green: #34C98A; --mono: 'JetBrains Mono', monospace;
  }
  body {
    background: var(--navy); color: var(--text); font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 44px 36px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .check {
    width: 56px; height: 56px; border-radius: 50%; background: rgba(52,201,138,0.15);
    color: var(--green); display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 20px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800;
    color: var(--white); margin-bottom: 12px;
  }
  p { font-size: 15px; color: var(--text-dim); line-height: 1.65; margin-bottom: 14px; }
  .payment-id {
    font-family: var(--mono); font-size: 12px; color: var(--ice);
    background: var(--navy); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin: 18px 0; word-break: break-all;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px; background: var(--amber); color: var(--navy);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 8px; text-decoration: none; margin-top: 8px;
  }
  .btn-primary:hover { background: var(--amber-dim); }
  .btn-ghost {
    display: inline-block; margin-top: 16px; font-size: 13px; color: var(--text-dim); text-decoration: none;
  }
  .btn-ghost:hover { color: var(--ice); }
  .note { font-size: 12px; color: var(--text-dim); margin-top: 22px; border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="check">✓</div>
  <h1>Payment received — thank you!</h1>
  <p>Your SnowLens Full Edition download is ready below.</p>

  <div class="payment-id" id="paymentIdBox">Payment reference: <span id="paymentId">—</span></div>

  <!-- TODO: once the verified-download endpoint is deployed, point this at it, e.g.
       https://snowlens-download.<you>.workers.dev/?razorpay_payment_id=...&razorpay_signature=...
       (params are forwarded automatically by the script below). Until then this falls back
       to a direct link — see DOWNLOAD_URL below. -->
  <a class="btn-primary" id="downloadBtn" href="#" target="_blank" rel="noopener">
    ↓ Download Full Edition
  </a>

  <div>
    <a class="btn-ghost" href="https://snowlens.vizcanvaz.com">← Back to SnowLens</a>
  </div>

  <div class="note">
    Having trouble, or the download link doesn't work? Email
    <a href="mailto:vizcanvas@gmail.com" style="color:var(--ice)">vizcanvas@gmail.com</a>
    with the payment reference above and we'll sort it out directly.
  </div>
</div>

<script>
  (function () {
    // Deployed Cloudflare verification worker.
    var VERIFY_ENDPOINT = 'https://snowlens-deploy.vizcanvas.workers.dev/';

    var params = new URLSearchParams(window.location.search);
    var paymentId = params.get('razorpay_payment_id');

    if (paymentId) {
      document.getElementById('paymentId').textContent = paymentId;
    } else {
      document.getElementById('paymentIdBox').style.display = 'none';
    }

    // Forward every razorpay_* query param Razorpay appended to this page
    // (razorpay_payment_id in particular) to the verification worker, which
    // confirms the payment with Razorpay's API before releasing the file.
    var forwardParams = new URLSearchParams();
    params.forEach(function (value, key) {
      if (key.indexOf('razorpay_') === 0) forwardParams.append(key, value);
    });

    var downloadBtn = document.getElementById('downloadBtn');
    if ([...forwardParams].length > 0) {
      downloadBtn.href = VERIFY_ENDPOINT + '?' + forwardParams.toString();
    } else {
      // No payment params present (e.g. someone opened this page directly) —
      // disable the button rather than exposing any file.
      downloadBtn.href = '#';
      downloadBtn.textContent = 'Download unavailable — check your payment link';
      downloadBtn.style.opacity = '0.5';
      downloadBtn.style.pointerEvents = 'none';
    }
  })();
</script>

</body>
</html>
